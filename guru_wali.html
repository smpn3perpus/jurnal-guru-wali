<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Guru Wali</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
}

header {
  background: #075985;
  color: white;
  padding: 18px;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
}

.logout {
  border: 0;
  background: #dc2626;
  color: white;
  padding: 10px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

.container {
  max-width: 1100px;
  margin: 25px auto;
  padding: 0 15px;
}

.profile {
  background: white;
  padding: 20px;
  border-radius: 14px;
  margin-bottom: 20px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.profile h2 {
  margin: 0 0 8px;
  color: #075985;
}

.cards {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.card-title {
  color: #64748b;
  font-size: 14px;
}

.card-number {
  margin-top: 8px;
  font-size: 30px;
  font-weight: bold;
  color: #075985;
}

.panel {
  background: white;
  padding: 20px;
  border-radius: 14px;
  box-shadow: 0 3px 12px rgba(0,0,0,.06);
}

.panel h2 {
  color: #075985;
  margin-top: 0;
}

.loading {
  text-align: center;
  padding: 20px;
  color: #64748b;
}

.error {
  padding: 12px;
  border-radius: 8px;
  background: #fee2e2;
  color: #991b1b;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 11px;
  border-bottom: 1px solid #e2e8f0;
  text-align: left;
}

th {
  background: #f8fafc;
}

.badge {
  display: inline-block;
  padding: 5px 9px;
  border-radius: 20px;
  background: #e0f2fe;
  color: #075985;
  font-size: 13px;
}

@media (max-width: 700px) {

  .cards {
    grid-template-columns: 1fr;
  }

  .header-inner {
    flex-direction: column;
    align-items: flex-start;
  }

}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div>
      <h1>Dashboard Guru Wali</h1>
      <p>SMP Negeri 3 Sibolga</p>
    </div>

    <button class="logout" onclick="logout()">
      Keluar
    </button>

  </div>
</header>


<div class="container">

  <div class="profile">

    <h2 id="namaGuru">
      Memuat guru...
    </h2>

    <div>
      Guru Wali
    </div>

  </div>


  <div class="cards">

    <div class="card">

      <div class="card-title">
        Jumlah Siswa
      </div>

      <div class="card-number" id="jumlahSiswa">
        -
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Jumlah Kelas
      </div>

      <div class="card-number" id="jumlahKelas">
        -
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Status
      </div>

      <div class="card-number" style="font-size:20px">
        AKTIF
      </div>

    </div>

  </div>


  <div class="panel">

    <h2>Daftar Siswa Wali</h2>

    <div id="hasil">
      <div class="loading">
        Mengambil data siswa...
      </div>
    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


/* =========================
   CEK LOGIN
========================= */

const akunText =
  sessionStorage.getItem("akun_login");


if (!akunText) {

  window.location.href = "index.html";

}


let akun;

try {

  akun = JSON.parse(akunText);

} catch (e) {

  sessionStorage.removeItem("akun_login");

  window.location.href = "index.html";

}


/* =========================
   CEK ROLE
========================= */

const role =
  String(akun.role || "").toLowerCase();


if (
  role !== "guru" &&
  role !== "guru_wali"
) {

  alert("Halaman ini khusus Guru Wali.");

  window.location.href = "index.html";

}


/* =========================
   IDENTITAS GURU
========================= */

const guruId =
  Number(akun.referensi_id);


if (!guruId) {

  document.getElementById("namaGuru").textContent =
    "ID Guru tidak ditemukan.";

  throw new Error(
    "referensi_id akun login tidak tersedia."
  );

}


/* =========================
   AMBIL DATA SISWA
========================= */

async function loadSiswa() {

  const hasil =
    document.getElementById("hasil");

  try {

    const url =
      SUPABASE_URL +
      "/rest/v1/siswa" +
      "?guru_wali_id=eq." +
      encodeURIComponent(guruId) +
      "&select=id,nama,nisn,kelas_id";


    const response =
      await fetch(url, {

        method: "GET",

        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY

        }

      });


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Gagal mengambil data siswa."
      );

    }


    document.getElementById("jumlahSiswa")
      .textContent = data.length;


    const kelasSet =
      new Set(
        data
          .map(s => s.kelas_id)
          .filter(x => x !== null)
      );


    document.getElementById("jumlahKelas")
      .textContent = kelasSet.size;


    if (data.length === 0) {

      hasil.innerHTML = `
        <div class="loading">
          Belum ada siswa yang terhubung
          dengan guru wali ini.
        </div>
      `;

      return;

    }


    let html = `

      <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>No</th>
            <th>Nama Siswa</th>
            <th>NISN</th>
            <th>Kelas ID</th>
          </tr>

        </thead>

        <tbody>
    `;


    data.forEach((siswa, index) => {

      html += `

        <tr>

          <td>${index + 1}</td>

          <td>
            ${escapeHtml(siswa.nama || "-")}
          </td>

          <td>
            ${escapeHtml(siswa.nisn || "-")}
          </td>

          <td>
            <span class="badge">
              ${siswa.kelas_id ?? "-"}
            </span>
          </td>

        </tr>

      `;

    });


    html += `

        </tbody>

      </table>

      </div>

    `;


    hasil.innerHTML = html;


  } catch (error) {

    console.error(error);

    hasil.innerHTML = `

      <div class="error">
        Gagal mengambil data siswa:
        ${escapeHtml(error.message)}
      </div>

    `;

  }

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================
   LOGOUT
========================= */

function logout() {

  sessionStorage.removeItem("akun_login");

  window.location.href =
    "index.html";

}


/* =========================
   MULAI
========================= */

loadSiswa();

</script>

</body>
</html>
