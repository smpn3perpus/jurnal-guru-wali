<script>

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


async function login() {

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const tombol =
    document.getElementById("btnLogin");

  const pesan =
    document.getElementById("pesan");


  if (!username || !password) {

    pesan.className = "error";

    pesan.textContent =
      "Username dan password wajib diisi.";

    return;
  }


  tombol.disabled = true;
  tombol.textContent = "MEMERIKSA...";


  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/rpc/cek_login",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        },

        body: JSON.stringify({
          p_username: username,
          p_password: password
        })
      }
    );


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Login gagal."
      );

    }


    if (!data || data.length === 0) {

      throw new Error(
        "Username atau password salah."
      );

    }


    const akun = data[0];


    /*
      SIMPAN DATA AKUN LOGIN
    */

    sessionStorage.setItem(
      "akun_login",
      JSON.stringify(akun)
    );


    pesan.className = "sukses";

    pesan.textContent =
      "Login berhasil. Membuka dashboard...";


    setTimeout(function() {

      bukaDashboard(akun);

    }, 500);


  } catch (error) {

    console.error(error);

    pesan.className = "error";

    pesan.textContent =
      error.message ||
      "Terjadi kesalahan saat login.";

    tombol.disabled = false;
    tombol.textContent = "LOGIN";

  }

}


function bukaDashboard(akun) {

  const role =
    String(akun.role || "")
      .trim()
      .toLowerCase();


  /*
    ADMIN
  */

  if (role === "admin") {

    window.location.href =
      "admin.html";

    return;
  }


  /*
    GURU WALI
  */

  if (
    role === "guru" ||
    role === "guru_wali"
  ) {

    window.location.href =
      "guru_wali.html";

    return;
  }


  /*
    ROLE LAIN
  */

  alert(
    "Role akun belum dikenali: " +
    akun.role
  );

}

</script>
