<!DOCTYPE html>

<title>Jurnal 7 KAIH - SMP Negeri 3 Sibolga</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#075985,#0284c7);
  padding:20px;
}

.container{
  width:100%;

  text-align:center;
}

.header{
  color:white;
  margin-bottom:30px;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  margin:10px 0 0;
  font-size:17px;
}

.login-box{
  background:white;

}

.login-box p{

}

.pilihan{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:28px;
}

.login-card{
  border:0;
  border-radius:15px;
  padding:25px 15px;
  cursor:pointer;
  transition:.2s;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.login-card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.icon{

  font-size:45px;
  margin-bottom:12px;
}

.admin{

.guru{

}

.siswa{

}

.footer{
  color:white;
  margin-top:20px;
  font-size:13px;
}

@media(max-width:650px){
  .pilihan{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:25px;
  }
}
</style>
</head>
