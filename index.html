```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jurnal 7 KAIH - SMP Negeri 3 Sibolga</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#075985,#0284c7);
  padding:20px;
}

.container{
  width:100%;
  max-width:900px;
  text-align:center;
}

.header{
  color:white;
  margin-bottom:30px;
}

.header h1{
  margin:0;
  font-size:32px;
}

.header p{
  margin:8px 0 0;
  font-size:17px;
}

.login-box{
  background:white;
  border-radius:20px;
  padding:30px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.login-box h2{
  margin-top:0;
  color:#075985;
}

.login-box p{
  color:#64748b;
}

.pilihan{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-top:25px;
}

.login-card{
  border:0;
  border-radius:15px;
  padding:25px 15px;
  cursor:pointer;
  transition:.2s;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.login-card:hover{
  transform:translateY(-4px);
  box-shadow:0 8px 20px rgba(0,0,0,.18);
}

.login-card .icon{
  font-size:45px;
  display:block;
  margin-bottom:12px;
}

.admin{
  background:#7c3aed;
}

.guru{
  background:#0284c7;
}

.siswa{
  background:#16a34a;
}

.footer{
  color:white;
  margin-top:20px;
  font-size:13px;
}

@media(max-width:650px){

  .pilihan{
    grid-template-columns:1fr;
  }

  .header h1{
    font-size:25px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <h1>
      📚 Jurnal 7 Kebiasaan Anak Indonesia Hebat
    </h1>

    <p>
      SMP Negeri 3 Sibolga
    </p>

  </div>


  <div class="login-box">

    <h2>
      Selamat Datang
    </h2>

    <p>
      Silakan pilih akun untuk masuk
    </p>


    <div class="pilihan">

      <!-- ADMIN / KEPALA SEKOLAH -->

      <button
        class="login-card admin"
        onclick="loginAdmin()">

        <span class="icon">
          👨‍💼
        </span>

        Admin / Kepala Sekolah

      </button>


      <!-- GURU -->

      <button
        class="login-card guru"
        onclick="loginGuru()">

        <span class="icon">
          👨‍🏫
        </span>

        Guru

      </button>


      <!-- SISWA -->

      <button
        class="login-card siswa"
        onclick="loginSiswa()">

        <span class="icon">
          👨‍🎓
        </span>

        Siswa

      </button>

    </div>

  </div>


  <div class="footer">

    © 2026 SMP Negeri 3 Sibolga

  </div>

</div>


<script>

function loginAdmin(){

  window.location.href =
    "login-admin.html";

}


function loginGuru(){

  window.location.href =
    "login-guru.html";

}


function loginSiswa(){

  window.location.href =
    "login-siswa.html";

}

</script>

</body>
</html>
