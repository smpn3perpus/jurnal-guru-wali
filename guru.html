  <div class="header-content">

      <p>SMP Negeri 3 Sibolga</p>

    <button class="logout" onclick="keluar()">
      Keluar
    </button>

  </div>

</header>


<main class="container">

  <section class="welcome">

    <h2 id="namaGuru">
      Guru Wali
    </h2>

    <div class="info">
      Selamat datang di Aplikasi Jurnal 7 Kebiasaan Anak Indonesia Hebat.
    </div>

  </section>

        class="card-number"
        id="jumlahSiswa">

      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Jumlah Kelas
      </div>

      <div
        class="card-number"
        id="jumlahKelas">
        0
      </div>

    </div>

      <div class="card-title">
        Guru Wali ID
      </div>

      <div
        class="card-number"
        id="guruId">

    </div>

  </section>

    <h2>Daftar Siswa Wali</h2>

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


/* =====================================================
   CEK SESSION LOGIN
===================================================== */

const session =
sessionStorage.getItem("akun_login");


if(!session){

  window.location.replace("index.html");

}


/* =====================================================
   BACA AKUN
===================================================== */

let akun = null;

try{

  akun = JSON.parse(session);

}catch(error){

  sessionStorage.removeItem("akun_login");

  window.location.replace("index.html");

}


/* =====================================================
   CEK ROLE
===================================================== */

const role =
String(akun.role || "")
.trim()
.toLowerCase();


if(
  role !== "guru" &&
  role !== "guru_wali"
){

  alert(
    "Akun ini bukan akun Guru Wali."
  );

  sessionStorage.removeItem("akun_login");

  window.location.replace("index.html");

}


/* =====================================================
   AMBIL IDENTITAS GURU
===================================================== */

const guruId =
Number(akun.referensi_id);


document.getElementById("guruId")
.textContent =
guruId || "-";


document.getElementById("namaGuru")
.textContent =
akun.nama ||
"Guru Wali";


/* =====================================================
   FUNGSI AMBIL SISWA
===================================================== */

async function ambilSiswa(){

  const status =
  document.getElementById("status");

  const daftar =
  document.getElementById("daftar");


  if(!guruId){

    status.className = "status error";

    status.textContent =
    "ID Guru Wali tidak ditemukan.";

    return;

  }


  status.className = "status";

  status.textContent =
  "Mengambil data siswa...";


  try{

    /*
      PENTING:

      Kita menggunakan RPC yang sudah dibuat
      di Supabase:

      ambil_siswa_guru_wali(bigint)
    */


    const response =
    await fetch(

      SUPABASE_URL +
      "/rest/v1/rpc/ambil_siswa_guru_wali",

      {

        method:"POST",

        headers:{

          "Content-Type":
          "application/json",

          "apikey":
          SUPABASE_KEY,

          "Authorization":
          "Bearer " + SUPABASE_KEY

        },

        body:JSON.stringify({

          p_guru_wali_id:
          guruId

        })

      }

    );


    const data =
    await response.json();


    console.log(
      "Data siswa:",
      data
    );


    if(!response.ok){

      throw new Error(

        data.message ||
        data.error_description ||
        "Gagal mengambil data siswa."

      );

    }


    /* ===============================================
       JUMLAH SISWA
    =============================================== */

    document.getElementById(
      "jumlahSiswa"
    ).textContent =
    Array.isArray(data)
      ? data.length
      : 0;


    /* ===============================================
       JUMLAH KELAS
    =============================================== */

    const daftarKelas =
    new Set(

      data
      .map(function(siswa){

        return siswa.kelas_id;

      })
      .filter(function(kelas){

        return kelas !== null &&
               kelas !== undefined;

      })

    );


    document.getElementById(
      "jumlahKelas"
    ).textContent =
    daftarKelas.size;


    /* ===============================================
       JIKA TIDAK ADA SISWA
    =============================================== */

    if(
      !Array.isArray(data) ||
      data.length === 0
    ){

      status.className =
      "status";

      status.textContent =
      "Belum ada siswa yang terhubung dengan Guru Wali ID " +
      guruId + ".";

      daftar.innerHTML = `
        <div class="empty">
          Tidak ada data siswa.
        </div>
      `;

      return;

    }


    /* ===============================================
       STATUS BERHASIL
    =============================================== */

    status.className =
    "status success";

    status.textContent =
    "Data siswa berhasil dimuat. Jumlah: " +
    data.length +
    " siswa.";


    /* ===============================================
       TABEL
    =============================================== */

    let html = `

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>No</th>

              <th>Nama Siswa</th>

              <th>NISN</th>

              <th>Kelas ID</th>

            </tr>

          </thead>

          <tbody>

    `;


    data.forEach(
      function(siswa,index){

        html += `

          <tr>

            <td>
              ${index + 1}
            </td>

            <td>
              ${aman(siswa.nama)}
            </td>

            <td>
              ${aman(siswa.nisn)}
            </td>

            <td>

              <span class="badge">

                ${aman(
                  siswa.kelas_id
                )}

              </span>

            </td>

          </tr>

        `;

      }
    );


    html += `

          </tbody>

        </table>

      </div>

    `;


    daftar.innerHTML =
    html;


  }catch(error){

    console.error(
      "ERROR:",
      error
    );


    status.className =
    "status error";

    status.textContent =
    "Gagal mengambil data siswa: " +
    error.message;

  }

}


/* =====================================================
   AMANKAN TEKS
===================================================== */

function aman(value){

  return String(
    value ?? "-"
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}


/* =====================================================
   LOGOUT
===================================================== */

function keluar(){

  sessionStorage.removeItem(
    "akun_login"
  );

  window.location.replace(
    "index.html"
  );

}


/* =====================================================
   JALANKAN
===================================================== */

ambilSiswa();

</script>

</body>
</html>
