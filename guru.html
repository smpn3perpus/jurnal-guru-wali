<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guru Wali - SMP Negeri 3 Sibolga</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}

.header{
  background:#075985;
  color:white;
  padding:20px;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.header h1{
  margin:0;
  font-size:22px;
}

.header p{
  margin:6px 0 0;
}

.logout{
  background:#dc2626;
  border:0;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:0 15px;
}

.welcome{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
  margin-bottom:20px;
}

.welcome h2{
  margin:0 0 8px;
  color:#075985;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:20px;
}

.card{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.card-title{
  color:#64748b;
  font-size:14px;
}

.card-number{
  font-size:30px;
  font-weight:bold;
  color:#075985;
  margin-top:8px;
}

.panel{
  background:white;
  padding:20px;
  border-radius:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.08);
}

.panel h2{
  color:#075985;
  margin-top:0;
}

.status{
  padding:12px;
  background:#f8fafc;
  border-radius:8px;
  margin-bottom:15px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
  padding:12px;
  border-radius:8px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,td{
  padding:12px;
  border-bottom:1px solid #e2e8f0;
  text-align:left;
}

th{
  background:#f8fafc;
}

.badge{
  display:inline-block;
  padding:5px 10px;
  border-radius:20px;
  background:#e0f2fe;
  color:#075985;
}

@media(max-width:700px){

  .cards{
    grid-template-columns:1fr;
  }

  .header-content{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
  }

}
</style>
</head>

<body>

<div class="header">

  <div class="header-content">

    <div>
      <h1>Dashboard Guru Wali</h1>
      <p>SMP Negeri 3 Sibolga</p>
    </div>

    <button class="logout" onclick="keluar()">
      Keluar
    </button>

  </div>

</div>


<div class="container">

  <div class="welcome">

    <h2 id="namaGuru">
      Guru Wali
    </h2>

    <div>
      Selamat datang di Aplikasi Jurnal 7 Kebiasaan Anak Indonesia Hebat.
    </div>

  </div>


  <div class="cards">

    <div class="card">

      <div class="card-title">
        Jumlah Siswa
      </div>

      <div class="card-number" id="jumlahSiswa">
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Jumlah Kelas
      </div>

      <div class="card-number" id="jumlahKelas">
        0
      </div>

    </div>


    <div class="card">

      <div class="card-title">
        Guru Wali ID
      </div>

      <div class="card-number" id="guruId">
        -
      </div>

    </div>

  </div>


  <div class="panel">

    <h2>Daftar Siswa Wali</h2>

    <div id="status" class="status">
      Memuat data siswa...
    </div>

    <div id="daftar"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


/* ==============================
   CEK LOGIN
============================== */

const session =
sessionStorage.getItem("akun_login");


if(!session){

  window.location.href="index.html";

}


let akun = null;


try{

  akun = JSON.parse(session);

}catch(error){

  sessionStorage.removeItem("akun_login");

  window.location.href="index.html";

}


/* ==============================
   CEK ROLE
============================== */

const role =
String(akun.role || "").toLowerCase();


if(
  role !== "guru" &&
  role !== "guru_wali"
){

  alert("Akun ini bukan akun Guru Wali.");

  window.location.href="index.html";

}


/* ==============================
   IDENTITAS GURU
============================== */

const guruId =
Number(akun.referensi_id);


document.getElementById("guruId")
.textContent =
guruId || "-";


document.getElementById("namaGuru")
.textContent =
akun.nama ||
"Guru Wali";


/* ==============================
   AMBIL SISWA
============================== */

async function ambilSiswa(){

  const status =
  document.getElementById("status");

  const daftar =
  document.getElementById("daftar");


  if(!guruId){

    status.className="error";

    status.textContent =
    "referensi_id guru tidak ditemukan pada akun.";

    return;

  }


  try{

    const url =
    SUPABASE_URL +
    "/rest/v1/siswa" +
    "?guru_wali_id=eq." +
    guruId +
    "&select=id,nama,nisn,kelas_id";


    const response =
    await fetch(url,{

      method:"GET",

      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":
        "Bearer "+SUPABASE_KEY
      }

    });


    const data =
    await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        "Gagal mengambil data siswa."
      );

    }


    document.getElementById("jumlahSiswa")
    .textContent=data.length;


    const kelas =
    new Set(
      data
      .map(x=>x.kelas_id)
      .filter(x=>x!==null)
    );


    document.getElementById("jumlahKelas")
    .textContent=kelas.size;


    if(data.length===0){

      status.textContent =
      "Belum ada siswa yang terhubung dengan guru wali ini.";

      daftar.innerHTML="";

      return;

    }


    status.textContent =
    "Data siswa berhasil dimuat.";


    let html=`

      <div class="table-wrap">

      <table>

      <thead>

      <tr>
        <th>No</th>
        <th>Nama Siswa</th>
        <th>NISN</th>
        <th>Kelas ID</th>
      </tr>

      </thead>

      <tbody>
    `;


    data.forEach((siswa,index)=>{

      html+=`

        <tr>

          <td>${index+1}</td>

          <td>
            ${aman(siswa.nama)}
          </td>

          <td>
            ${aman(siswa.nisn)}
          </td>

          <td>
            <span class="badge">
              ${siswa.kelas_id ?? "-"}
            </span>
          </td>

        </tr>

      `;

    });


    html+=`

      </tbody>

      </table>

      </div>
    `;


    daftar.innerHTML=html;


  }catch(error){

    console.error(error);

    status.className="error";

    status.textContent =
    "Gagal mengambil data siswa: "+
    error.message;

  }

}


/* ==============================
   AMANKAN TEKS
============================== */

function aman(value){

  return String(value ?? "-")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");

}


/* ==============================
   LOGOUT
============================== */

function keluar(){

  sessionStorage.removeItem("akun_login");

  window.location.href="index.html";

}


/* ==============================
   MULAI
============================== */

ambilSiswa();

</script>

</body>
</html>
