<script>

/* =====================================================
   HITUNG STATUS FEEDBACK SATU JURNAL
===================================================== */

async function cekStatusFeedbackJurnal(jurnalId){

  const feedback =
    await ambilFeedback(jurnalId);

  const wajib = [
    "bangun_pagi",
    "makan_sehat",
    "belajar_malam",
    "olahraga",
    "bermasyarakat",
    "ibadah",
    "tidur_cepat"
  ];

  const bagian =
    new Set(
      feedback
        .map(f => f.bagian)
        .filter(Boolean)
    );

  return {
    feedback,
    lengkap:
      wajib.every(
        item => bagian.has(item)
      )
  };

}


/* =====================================================
   HITUNG ULANG RINGKASAN
===================================================== */

async function hitungRingkasan(tanggal){

  try{

    const jurnal =
      await ambilJurnalGuru(
        tanggal
      );

    let sudah = 0;
    let belum = 0;

    for(
      const j of jurnal
    ){

      const hasil =
        await cekStatusFeedbackJurnal(
          j.id
        );

      if(hasil.lengkap){

        sudah++;

      }else{

        belum++;

      }

    }


    document.getElementById(
      "jumlahSiswa"
    ).textContent =
      daftarSiswa.length;


    document.getElementById(
      "belumFeedback"
    ).textContent =
      belum;


    document.getElementById(
      "sudahFeedback"
    ).textContent =
      sudah;

  }catch(error){

    console.error(
      "GAGAL HITUNG RINGKASAN:",
      error
    );

  }

}


/* =====================================================
   SIMPAN FEEDBACK
===================================================== */

async function simpanFeedback(button){

  const jurnalId =
    Number(
      button.dataset.jurnal
    );

  const bagian =
    button.dataset.bagian;

  const box =
    button.closest(
      ".feedback"
    );

  const active =
    box.querySelector(
      ".respons button.active"
    );


  if(!active){

    alert(
      "Pilih ❤️ Suka, 🙂 Biasa, atau 😔 Kecewa terlebih dahulu."
    );

    return;

  }


  const respons =
    active.dataset.respons;

  const komentar =
    box.querySelector(
      ".komentar"
    ).value.trim();


  button.disabled =
    true;

  button.textContent =
    "⏳ Menyimpan...";


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/simpan_feedback",

        {
          method:"POST",

          headers:
            headers(),

          body:
            JSON.stringify({

              p_jurnal_id:
                jurnalId,

              p_guru_id:
                Number(
                  guru.id
                ),

              p_respons:
                respons,

              p_komentar:
                komentar,

              p_bagian:
                bagian

            })

        }

      );


    const text =
      await response.text();


    let data={};

    try{

      data =
        text
        ? JSON.parse(text)
        : {};

    }catch(error){

      data={};

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        data.details ||
        data.hint ||
        text ||
        "Gagal menyimpan feedback."
      );

    }


    /* =========================================
       FEEDBACK BERHASIL
    ========================================= */

    button.textContent =
      "✅ Tersimpan";


    const status =
      box.querySelector(
        ".feedback-status"
      );


    status.textContent =
      "✓ Feedback sudah tersimpan";


    /*
      Hitung ulang ringkasan langsung
      berdasarkan database.
    */

    const tanggal =
      document.getElementById(
        "tanggalJurnal"
      ).value;


    await hitungRingkasan(
      tanggal
    );


    /*
      Cek apakah seluruh 7 bagian
      jurnal ini sudah selesai.
    */

    const hasil =
      await cekStatusFeedbackJurnal(
        jurnalId
      );


    const siswaBox =
      button.closest(
        ".siswa-box"
      );


    if(siswaBox){

      const badge =
        siswaBox.querySelector(
          ".badge-sudah"
        );


      if(
        badge &&
        hasil.lengkap
      ){

        badge.innerHTML =
          "✅ SUDAH MENGISI JURNAL" +
          "<br>✅ SUDAH FEEDBACK";

      }

    }


  }catch(error){

    console.error(
      "FEEDBACK ERROR:",
      error
    );


    alert(
      "Gagal menyimpan feedback:\n\n" +
      error.message
    );


    button.textContent =
      "✅ Simpan Feedback";

  }finally{

    button.disabled =
      false;

  }

}

  daftar.innerHTML =

                👨‍🎓 ${aman(siswa.nama)}

              <div class="siswa-detail">

                NISN:
                ${aman(siswa.nisn || "-")}

                <br>

                Kelas:
                ${aman(kelasNama)}

                <br>

                Tanggal:
                ${aman(
                  formatTanggal(
                    jurnalSiswa.tanggal
                  )
                )}

              </div>

            </div>


            <span class="badge badge-sudah">

              ✅ SUDAH MENGISI JURNAL

              ${
                hasilFeedback.lengkap
                ? "<br>✅ SUDAH FEEDBACK"
                : "<br>📝 BELUM FEEDBACK"
              }

            </span>

          </div>


          <div
            id="detail_${jurnalSiswa.id}"
            class="jurnal-detail">

            ${buatJurnal(
              jurnalSiswa,
              feedback
            )}

          </div>

        </div>

      `;

    }


    if(!html){

      html =
        '<div class="status">' +
        'Belum ada siswa wali.' +
        '</div>';

    }


    daftar.innerHTML =
      html;


    /*
      Hitung ringkasan langsung
      dari database.
    */

    await hitungRingkasan(
      tanggal
    );


    status.className =
      "status ok";


    status.textContent =
      "Tanggal " +
      formatTanggal(tanggal) +
      ": " +
      jurnal.length +
      " jurnal masuk dari " +
      daftarSiswa.length +
      " siswa.";

  }catch(error){

    console.error(
      "TAMPIL DAFTAR ERROR:",
      error
    );


    tampilkanError(
      error
    );


    status.className =
      "status error";

    status.textContent =
      error.message;

    daftar.innerHTML =
      "";

  }finally{

    tombol.disabled =
      false;

    tombol.textContent =
      "🔎 Tampilkan";

  }

}

</script>
