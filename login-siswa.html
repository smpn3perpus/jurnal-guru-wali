<!DOCTYPE html>

<title>Login Siswa - Jurnal 7 KAIH</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#075985,#0ea5e9);
  display:flex;

  width:100%;

  padding:30px;
  box-shadow:0 10px 35px rgba(0,0,0,.2);
}

.logo{
  width:80px;
  height:80px;
  margin:0 auto 15px;
  border-radius:50%;
  background:#e0f2fe;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
}

h1{
  text-align:center;

  text-align:center;

  width:100%;

<body>

<div class="login-box">

  <div class="logo">
    🎓
  </div>

  <h1>Login Siswa</h1>

  <div class="subtitle">
    Jurnal 7 Kebiasaan Anak Indonesia Hebat<br>
    <b>SMP Negeri 3 Sibolga</b>
  </div>

  <div id="pesanError" class="error"></div>

  <form id="formLogin">

    <label for="nisn">
      Username / NISN
    </label>

    <input
      type="text"
      id="nisn"
      placeholder="Masukkan NISN"
      autocomplete="username"
      inputmode="numeric"
      required
    >

    <label for="password">
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Masukkan password"
      autocomplete="current-password"
      required
    >

    <label class="show-password">
      <input
        type="checkbox"
        id="lihatPassword"
      >
      Tampilkan password
    </label>

    <button
      type="submit"
      class="btn-login"
      id="btnLogin">

      🔐 Masuk sebagai Siswa

    </button>

  </form>

  <div class="info">
    <b>Informasi Login</b><br>
    Username dan password menggunakan NISN siswa.
  </div>

  <div class="footer">
    © SMP Negeri 3 Sibolga
  </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


function headersSupabase(){

  return {

    "apikey": SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Accept":
      "application/json"

  };

}


/* =====================================================
   ELEMEN
===================================================== */

const form =
document.getElementById("formLogin");

const nisnInput =
document.getElementById("nisn");

const passwordInput =
document.getElementById("password");

const btnLogin =
document.getElementById("btnLogin");

const pesanError =
document.getElementById("pesanError");

const lihatPassword =
document.getElementById("lihatPassword");


/* =====================================================
   TAMPILKAN PASSWORD
===================================================== */

lihatPassword.addEventListener(
  "change",
  function(){

    passwordInput.type =
      this.checked
      ? "text"
      : "password";

  }
);


/* =====================================================
   PESAN ERROR
===================================================== */

function tampilError(pesan){

  pesanError.style.display =
    "block";

  pesanError.textContent =
    pesan;

}


function hilangkanError(){

  pesanError.style.display =
    "none";

  pesanError.textContent =
    "";

}


/* =====================================================
   LOGIN
===================================================== */

form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    hilangkanError();

    const nisn =
      nisnInput.value.trim();

    const password =
      passwordInput.value.trim();


    if(!nisn){

      tampilError(
        "Silakan masukkan NISN."
      );

      nisnInput.focus();

      return;

    }


    if(!password){

      tampilError(
        "Silakan masukkan password."
      );

      passwordInput.focus();

      return;

    }


    /*
      Password siswa = NISN
    */

    if(password !== nisn){

      tampilError(
        "Password salah. Password siswa adalah NISN."
      );

      passwordInput.focus();

      return;

    }


    btnLogin.disabled =
      true;

    btnLogin.textContent =
      "⏳ Memeriksa login...";


    try{

      /*
        Cari siswa berdasarkan NISN.
      */

      const url =
        SUPABASE_URL +
        "/rest/v1/siswa" +
        "?nisn=eq." +
        encodeURIComponent(nisn) +
        "&select=*";


      console.log(
        "Mencari siswa:",
        nisn
      );


      const response =
        await fetch(
          url,
          {
            method:"GET",
            headers:
              headersSupabase()
          }
        );


      const text =
        await response.text();


      let data = [];

      try{

        data =
          text
          ? JSON.parse(text)
          : [];

      }catch(error){

        throw new Error(
          "Data dari server tidak dapat dibaca."
        );

      }


      if(!response.ok){

        console.error(
          "Supabase error:",
          data
        );

        throw new Error(
          data.message ||
          data.hint ||
          data.details ||
          "Gagal menghubungi database."
        );

      }


      if(!Array.isArray(data)){

        throw new Error(
          "Format data siswa tidak valid."
        );

      }


      /*
        NISN tidak ditemukan.
      */

      if(data.length === 0){

        tampilError(
          "NISN tidak ditemukan. Periksa kembali NISN Anda."
        );

        return;

      }


      /*
        Kalau ada lebih dari satu siswa
        dengan NISN yang sama,
        login dihentikan.
      */

      if(data.length > 1){

        tampilError(
          "NISN terdaftar lebih dari satu kali. Silakan hubungi Admin."
        );

        console.error(
          "NISN DUPLIKAT:",
          data
        );

        return;

      }


      const siswa =
        data[0];


      console.log(
        "SISWA LOGIN:",
        siswa
      );


      /*
        Simpan akun siswa.
      */

      const akunSiswa = {

        tipe:
          "siswa",

        id:
          siswa.id,

        nama:
          siswa.nama,

        nisn:
          siswa.nisn,

        kelas_id:
          siswa.kelas_id,

        guru_wali_id:
          siswa.guru_wali_id

      };


      sessionStorage.setItem(
        "akun_login",
        JSON.stringify(
          akunSiswa
        )
      );


      /*
        Simpan khusus siswa juga.
      */

      sessionStorage.setItem(
        "akun_siswa",
        JSON.stringify(
          akunSiswa
        )
      );


      /*
        Berhasil.
      */

      btnLogin.textContent =
        "✓ Login berhasil...";


      window.location.href =
        "dashboard-siswa.html";


    }catch(error){

      console.error(
        "LOGIN SISWA ERROR:",
        error
      );


      tampilError(
        "Login gagal: " +
        error.message
      );


    }finally{

      btnLogin.disabled =
        false;


      if(
        btnLogin.textContent
        ===
        "⏳ Memeriksa login..."
      ){

        btnLogin.textContent =
          "🔐 Masuk sebagai Siswa";

      }

    }

  }
);


/* =====================================================
   JIKA SUDAH LOGIN
===================================================== */

const akunLama =
sessionStorage.getItem(
  "akun_siswa"
);


if(akunLama){

  try{

    const akun =
      JSON.parse(akunLama);


    if(
      akun &&
      akun.tipe === "siswa" &&
      akun.id
    ){

      /*
        Bisa langsung masuk dashboard.
        Jika tidak ingin fitur ini,
        bagian ini dapat dihapus.
      */

      console.log(
        "Siswa sudah login:",
        akun
      );

    }

  }catch(e){

    sessionStorage.removeItem(
      "akun_siswa"
    );

  }

}

</script>

</body>
</html>
