<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Login Siswa - Jurnal 7 KAIH</title>

<style>

*{
  box-sizing:border-box;
}

body{

  margin:0;

  min-height:100vh;

  font-family:Arial,sans-serif;

  background:
    linear-gradient(
      135deg,
      #e0f2fe,
      #f8fafc
    );

  display:flex;

  align-items:center;

  justify-content:center;

  padding:20px;

}

.login-card{

  width:100%;

  max-width:420px;

  background:white;

  padding:30px;

  border-radius:20px;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.12);

}

.logo{

  width:80px;

  height:80px;

  margin:auto;

  border-radius:20px;

  background:#075985;

  color:white;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:27px;

  font-weight:bold;

}

h1{

  text-align:center;

  font-size:22px;

  color:#075985;

  margin:
    18px 0 5px;

}

.school{

  text-align:center;

  color:#64748b;

  margin-bottom:25px;

  font-size:14px;

}

label{

  display:block;

  font-weight:bold;

  margin:
    15px 0 7px;

}

input{

  width:100%;

  padding:13px;

  border:
    1px solid #cbd5e1;

  border-radius:10px;

  font-size:16px;

  outline:none;

}

input:focus{

  border-color:#075985;

  box-shadow:
    0 0 0 3px
    rgba(7,89,133,.1);

}

button{

  width:100%;

  margin-top:20px;

  padding:14px;

  border:0;

  border-radius:10px;

  background:#075985;

  color:white;

  font-size:16px;

  font-weight:bold;

  cursor:pointer;

}

button:hover{

  background:#0369a1;

}

button:disabled{

  opacity:.6;

  cursor:wait;

}

#pesan{

  display:none;

  margin-top:15px;

  padding:12px;

  border-radius:9px;

  text-align:center;

  line-height:1.5;

}

.error{

  display:block!important;

  background:#fee2e2;

  color:#991b1b;

}

.sukses{

  display:block!important;

  background:#dcfce7;

  color:#166534;

}

.info{

  margin-top:18px;

  padding:12px;

  border-radius:9px;

  background:#eff6ff;

  color:#075985;

  font-size:13px;

  line-height:1.6;

}

footer{

  text-align:center;

  margin-top:25px;

  color:#777;

  font-size:12px;

}

</style>

</head>

<body>

<div class="login-card">

  <div class="logo">
    JW
  </div>

  <h1>
    LOGIN SISWA
  </h1>

  <div class="school">
    APLIKASI JURNAL 7 KEBIASAAN ANAK INDONESIA HEBAT
    <br>
    SMP NEGERI 3 SIBOLGA
  </div>


  <label for="username">
    NISN
  </label>

  <input
    type="text"
    id="username"
    placeholder="Masukkan NISN"
    autocomplete="username"
    inputmode="numeric"
  >


  <label for="password">
    Password
  </label>

  <input
    type="password"
    id="password"
    placeholder="Masukkan password"
    autocomplete="current-password"
  >


  <button
    id="btnLogin"
    onclick="loginSiswa()"
  >
    LOGIN
  </button>


  <div
    id="pesan">
  </div>


  <div class="info">

    <b>Informasi Login</b>
    <br><br>

    Username:
    <b>NISN</b>

    <br>

    Password awal:
    <b>NISN</b>

    <br><br>

    Contoh:
    <br>

    NISN:
    <b>0142655861</b>

    <br>

    Password:
    <b>0142655861</b>

  </div>


  <footer>
    Created by Mr. Rahmat Batubara, S.T.P
  </footer>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


/* =====================================================
   LOGIN SISWA
===================================================== */

async function loginSiswa(){

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const tombol =
    document
      .getElementById("btnLogin");

  const pesan =
    document
      .getElementById("pesan");


  pesan.className = "";
  pesan.textContent = "";


  if(!username){

    pesan.className = "error";

    pesan.textContent =
      "NISN wajib diisi.";

    return;

  }


  if(!password){

    pesan.className = "error";

    pesan.textContent =
      "Password wajib diisi.";

    return;

  }


  tombol.disabled = true;

  tombol.textContent =
    "MEMERIKSA...";


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/cek_login",

        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          },

          body:
            JSON.stringify({

              p_username:
                username,

              p_password:
                password

            })

        }

      );


    const text =
      await response.text();


    let data = [];

    try{

      data =
        text
        ? JSON.parse(text)
        : [];

    }catch(e){

      throw new Error(
        "Respons server tidak valid."
      );

    }


    console.log(
      "HASIL LOGIN:",
      data
    );


    if(!response.ok){

      throw new Error(

        data.message ||
        data.hint ||
        data.details ||
        "Login gagal."

      );

    }


    if(
      !Array.isArray(data) ||
      data.length === 0
    ){

      throw new Error(
        "NISN atau password salah."
      );

    }


    const akun =
      data[0];


    /* =================================================
       PASTIKAN AKUN SISWA
    ================================================= */

    const role =
      String(
        akun.role || ""
      )
      .trim()
      .toLowerCase();


    if(role !== "siswa"){

      throw new Error(
        "Akun ini bukan akun siswa."
      );

    }


    /* =================================================
       PASTIKAN ID SISWA ADA
    ================================================= */

    if(
      !akun.id ||
      !akun.referensi_id
    ){

      throw new Error(
        "ID siswa tidak ditemukan."
      );

    }


    /* =================================================
       SIMPAN SESSION SISWA
    ================================================= */

    const sessionSiswa = {

      id:
        Number(akun.id),

      username:
        akun.username,

      role:
        "siswa",

      tipe:
        "siswa",

      referensi_id:
        Number(akun.referensi_id),

      nama:
        akun.nama || "Siswa"

    };


    sessionStorage.setItem(
      "akun_siswa",
      JSON.stringify(
        sessionSiswa
      )
    );


    /* =================================================
       HAPUS SESSION LOGIN LAMA
    ================================================= */

    sessionStorage.removeItem(
      "akun_login"
    );


    pesan.className =
      "sukses";

    pesan.textContent =
      "Login berhasil. Membuka dashboard siswa...";


    setTimeout(

      function(){

       window.location.replace(
  "dashboard-siswa.html"
);

      },

      500

    );


  }catch(error){

    console.error(
      "LOGIN ERROR:",
      error
    );


    pesan.className =
      "error";

    pesan.textContent =
      error.message ||
      "Terjadi kesalahan saat login.";


    tombol.disabled =
      false;

    tombol.textContent =
      "LOGIN";

  }

}


/* =====================================================
   ENTER UNTUK LOGIN
===================================================== */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        loginSiswa();

      }

    }
  );


/* =====================================================
   CEK SESSION LAMA
===================================================== */

(function(){

  const session =
    sessionStorage.getItem(
      "akun_siswa"
    );


  if(!session)
    return;


  try{

    const akun =
      JSON.parse(session);


    if(
      akun &&
      akun.tipe === "siswa" &&
      akun.id
    ){

      /*
        Session masih ada.
        Jangan langsung memaksa masuk.
        Pengguna tetap berada di halaman
        login agar dapat login ulang.
      */

    }

  }catch(e){

    sessionStorage.removeItem(
      "akun_siswa"
    );

  }

})();

</script>

</body>
</html>
