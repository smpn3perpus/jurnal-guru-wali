<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin - Jurnal 7 KAIH</title>

<style>
*{box-sizing:border-box}

body{

.logo{

}

h1{
  text-align:center;

label{

button{

button:hover{
  background:#5b21b6;

  margin-top:12px;

  display:none;

  display:block;

</head>

<body>

<div class="login-box">

  <div class="logo">👨‍💼</div>

  <h1>Login Admin</h1>

  <div class="subtitle">
    Jurnal 7 Kebiasaan Anak Indonesia Hebat<br>
    SMP Negeri 3 Sibolga
  </div>

  <div id="status" class="status"></div>

  <form id="formLogin">

    <label>Username</label>

    <input
      type="text"
      id="username"
      placeholder="Masukkan username"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Masukkan password"
      required
    >

    <button
      type="submit"
      id="btnLogin">
      🔐 Masuk sebagai Admin
    </button>

  </form>

  <button
    class="kembali"
    onclick="location.href='index.html'">
    ← Kembali
  </button>

</div>


<script>

const SUPABASE_URL =
"https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


function headersSupabase(){

  return {
    "apikey":SUPABASE_KEY,
    "Authorization":
      "Bearer " + SUPABASE_KEY,
    "Content-Type":
      "application/json",
    "Accept":
      "application/json"
  };

}


document
.getElementById("formLogin")
.addEventListener("submit",async function(e){

  e.preventDefault();

  const username =
    document.getElementById("username")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const status =
    document.getElementById("status");

  const btn =
    document.getElementById("btnLogin");


  status.className="status loading";
  status.textContent="Memeriksa akun...";

  btn.disabled=true;


  try{

    /*
      Admin menggunakan tabel admin
    */

    const url =
      SUPABASE_URL +
      "/rest/v1/admin" +
      "?select=*" +
      "&username=eq." +
      encodeURIComponent(username) +
      "&password=eq." +
      encodeURIComponent(password);


    const response =
      await fetch(
        url,
        {
          headers:
            headersSupabase()
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.message ||
        "Gagal menghubungi server."
      );

    }


    if(!data.length){

      throw new Error(
        "Username atau password Admin salah."
      );

    }


    const admin=data[0];


    sessionStorage.setItem(
      "akun_admin",
      JSON.stringify({
        id:admin.id,
        nama:
          admin.nama ||
          admin.nama_admin ||
          "Admin",
        tipe:"admin"
      })
    );


    window.location.href =
      "dashboard-admin.html";


  }catch(error){

    status.className="status error";

    status.textContent =
      error.message;

  }finally{

    btn.disabled=false;

  }

});

</script>

</body>
</html>
