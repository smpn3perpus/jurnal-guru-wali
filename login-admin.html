    id="password"
    placeholder="Masukkan password"
    autocomplete="current-password"
  >

  <button
    id="btnLogin"
    onclick="loginAdmin()">
    LOGIN
  </button>

  </div>

<script>

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


async function loginAdmin(){

  const username =
    document
      .getElementById("username")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;

  const tombol =
    document
      .getElementById("btnLogin");

  const pesan =
    document
      .getElementById("pesan");


  pesan.className="";
  pesan.textContent="";


  if(!username){

    pesan.className="error";

    pesan.textContent=
      "Username wajib diisi.";

    return;

  }


  if(!password){

    pesan.className="error";

    pesan.textContent=
      "Password wajib diisi.";

    return;

  }


  tombol.disabled=true;

  tombol.textContent=
    "MEMERIKSA...";


  try{

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/cek_login",

        {

          method:"POST",

          headers:{

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          },

          body:
            JSON.stringify({

              p_username:
                username,

              p_password:
                password

            })

        }

      );


    const text =
      await response.text();


    let data=[];


    try{

      data =
        text
        ? JSON.parse(text)
        : [];

    }catch(error){

      throw new Error(
        "Respons server tidak valid."
      );

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        data.hint ||
        data.details ||
        text ||
        "Login gagal."
      );

    }


    if(
      !Array.isArray(data) ||
      data.length===0
    ){

      throw new Error(
        "Username atau password salah."
      );

    }


    const akun =
      data[0];


    const role =
      String(
        akun.role || ""
      )
      .trim()
      .toLowerCase();


    if(role !== "admin"){

      throw new Error(
        "Akun ini bukan akun admin."
      );

    }


    const sessionAdmin = {

      id:
        Number(akun.id),

      username:
        akun.username,

      role:
        "admin",

      tipe:
        "admin",

      referensi_id:
        Number(akun.referensi_id),

      nama:
        akun.nama ||
        "Admin / Kepala Sekolah"

    };


    sessionStorage.setItem(
      "akun_admin",
      JSON.stringify(
        sessionAdmin
      )
    );


    /*
      Catat login Admin.
    */

    try{

      await fetch(

        SUPABASE_URL +
        "/rest/v1/log_login",

        {

          method:"POST",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              username:
                sessionAdmin.username,

              role:
                "admin",

              referensi_id:
                sessionAdmin.referensi_id

            })

        }

      );

    }catch(error){

      console.error(
        "Gagal mencatat login admin:",
        error
      );

    }


    pesan.className="sukses";

    pesan.textContent=
      "Login berhasil. Membuka dashboard...";


    setTimeout(
      function(){

        window.location.replace(
          "admin.html"
        );

      },
      400
    );


  }catch(error){

    console.error(
      "LOGIN ADMIN:",
      error
    );


    pesan.className="error";

    pesan.textContent=
      error.message ||
      "Terjadi kesalahan saat login.";


    tombol.disabled=false;

    tombol.textContent=
      "LOGIN";

  }

}


/* ENTER UNTUK LOGIN */

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        loginAdmin();

      }

    }
  );


/* JIKA SUDAH LOGIN */

(function(){

  const saved =
    sessionStorage.getItem(
      "akun_admin"
    );


  if(!saved)
    return;


  try{

    const akun =
      JSON.parse(saved);


    if(
      akun &&
      akun.role === "admin" &&
      akun.referensi_id
    ){

      window.location.replace(
        "admin.html"
      );

    }

  }catch(error){

    sessionStorage.removeItem(
      "akun_admin"
    );

  }

})();

</script>
