<script>

const SUPABASE_URL =
"https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
"sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


async function loginAdmin(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const tombol =
    document.getElementById("btnLogin");

  const pesan =
    document.getElementById("pesan");

  pesan.className="";
  pesan.textContent="";

  if(!username){

    pesan.className="error";
    pesan.textContent="Username wajib diisi.";
    return;

  }

  if(!password){

    pesan.className="error";
    pesan.textContent="Password wajib diisi.";
    return;

  }

  tombol.disabled=true;
  tombol.textContent="MEMERIKSA...";

  try{

    /*
      Login menggunakan RPC cek_login.
      Fungsi ini membaca tabel akun_login.
    */

    const response = await fetch(
      SUPABASE_URL + "/rest/v1/rpc/cek_login",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY
        },

        body:JSON.stringify({
          p_username:username,
          p_password:password
        })
      }
    );

    const text =
      await response.text();

    let data=[];

    try{

      data =
        text ? JSON.parse(text) : [];

    }catch(e){

      throw new Error(
        "Respons server tidak valid."
      );

    }

    console.log("HASIL LOGIN ADMIN:",data);

    if(!response.ok){

      throw new Error(
        data.message ||
        data.hint ||
        data.details ||
        "Login gagal."
      );

    }

    if(
      !Array.isArray(data) ||
      data.length===0
    ){

      throw new Error(
        "Username atau password salah."
      );

    }

    const akun=data[0];

    const role =
      String(akun.role || "")
      .trim()
      .toLowerCase();

    if(role!=="admin"){

      throw new Error(
        "Akun ini bukan akun admin."
      );

    }

    if(!akun.id){

      throw new Error(
        "ID akun tidak ditemukan."
      );

    }

    const sessionAdmin={

      id:Number(akun.id),

      username:akun.username,

      role:"admin",

      tipe:"admin",

      referensi_id:
        akun.referensi_id
        ? Number(akun.referensi_id)
        : null,

      nama:
        akun.nama || "Admin / Kepala Sekolah"

    };

    sessionStorage.setItem(
      "akun_admin",
      JSON.stringify(sessionAdmin)
    );

    sessionStorage.removeItem("akun_login");

    pesan.className="sukses";

    pesan.textContent =
      "Login berhasil. Membuka dashboard admin...";

    setTimeout(function(){

      window.location.replace("admin.html");

    },500);

  }catch(error){

    console.error(
      "LOGIN ADMIN ERROR:",
      error
    );

    pesan.className="error";

    pesan.textContent =
      error.message ||
      "Terjadi kesalahan saat login.";

    tombol.disabled=false;
    tombol.textContent="LOGIN";

  }

}


document
.getElementById("password")
.addEventListener(
  "keydown",
  function(event){

    if(event.key==="Enter"){

      loginAdmin();

    }

  }
);

</script>
