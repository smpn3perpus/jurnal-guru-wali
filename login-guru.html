<div class="login-card">

<script>

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


async function loginGuru(){

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;

  const tombol =
    document.getElementById("btnLogin");

  const pesan =
    document.getElementById("pesan");


  pesan.className = "";
  pesan.textContent = "";


  if(!username){

    pesan.className = "error";
    pesan.textContent = "Username / NIP wajib diisi.";
    return;

  }


  if(!password){

    pesan.className = "error";
    pesan.textContent = "Password wajib diisi.";
    return;

  }


  tombol.disabled = true;
  tombol.textContent = "MEMERIKSA...";


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/rpc/cek_login",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY
          },

          body:JSON.stringify({
            p_username:username,
            p_password:password
          })
        }
      );


    const text =
      await response.text();


    let data = [];

    try{

      data =
        text ? JSON.parse(text) : [];

    }catch(error){

      throw new Error(
        "Respons server tidak valid."
      );

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        data.hint ||
        data.details ||
        "Login gagal."
      );

    }


    if(
      !Array.isArray(data) ||
      data.length === 0
    ){

      throw new Error(
        "Username atau password salah."
      );

    }


    const akun =
      data[0];


    const role =
      String(
        akun.role || ""
      )
      .trim()
      .toLowerCase();


    if(role !== "guru"){

      throw new Error(
        "Akun ini bukan akun guru."
      );

    }


    if(
      !akun.id ||
      !akun.referensi_id
    ){

      throw new Error(
        "ID Guru tidak ditemukan."
      );

    }


    const sessionGuru = {

      id:
        Number(akun.id),

      username:
        akun.username,

      role:
        "guru",

      tipe:
        "guru",

      referensi_id:
        Number(akun.referensi_id),

      nama:
        akun.nama || "Guru Wali"

    };


    sessionStorage.setItem(
      "akun_guru",
      JSON.stringify(sessionGuru)
    );


    sessionStorage.removeItem(
      "akun_login"
    );


    /*
      Catat login guru.
    */

    try{

      await fetch(
        SUPABASE_URL +
        "/rest/v1/log_login",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Prefer":"return=minimal"
          },

          body:JSON.stringify({

            username:
              akun.username,

            role:
              "guru",

            referensi_id:
              Number(akun.referensi_id)

          })
        }
      );

    }catch(error){

      console.error(
        "Gagal mencatat login guru:",
        error
      );

    }


    pesan.className =
      "sukses";

    pesan.textContent =
      "Login berhasil. Membuka dashboard guru...";


    setTimeout(function(){

      window.location.replace(
        "guru.html"
      );

    },500);


  }catch(error){

    console.error(
      "LOGIN GURU ERROR:",
      error
    );


    pesan.className =
      "error";

    pesan.textContent =
      error.message ||
      "Terjadi kesalahan saat login.";


    tombol.disabled =
      false;

    tombol.textContent =
      "LOGIN";

  }

}


/*
  Tekan Enter untuk login.
*/

document
  .getElementById("password")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        loginGuru();

      }

    }
  );

</script>
