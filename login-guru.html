<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://nnnvgbajiqlqrsaygxme.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_dHIoPw_gfvud74PH4UCp2w_yGzl9oDy";


function headers(){

  return {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer " + SUPABASE_KEY,

    "Content-Type":
      "application/json",

    "Accept":
      "application/json"

  };

}


/* =====================================================
   LOGIN GURU
===================================================== */

async function loginGuru(){

  const username =
    document.getElementById(
      "username"
    ).value.trim();


  const password =
    document.getElementById(
      "password"
    ).value;


  const tombol =
    document.getElementById(
      "btnLogin"
    );


  const pesan =
    document.getElementById(
      "pesan"
    );


  pesan.className="";
  pesan.textContent="";


  if(!username){

    pesan.className="error";

    pesan.textContent=
      "Username wajib diisi.";

    return;

  }


  if(!password){

    pesan.className="error";

    pesan.textContent=
      "Password wajib diisi.";

    return;

  }


  tombol.disabled=true;

  tombol.textContent=
    "MEMERIKSA...";


  try{

    /* =========================================
       CEK LOGIN
    ========================================= */

    const response =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/cek_login",

        {

          method:"POST",

          headers:
            headers(),

          body:
            JSON.stringify({

              p_username:
                username,

              p_password:
                password

            })

        }

      );


    const text =
      await response.text();


    let data=[];


    try{

      data =
        text
        ? JSON.parse(text)
        : [];

    }catch(error){

      throw new Error(
        "Respons server tidak valid."
      );

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        data.details ||
        data.hint ||
        text ||
        "Login gagal."
      );

    }


    if(
      !Array.isArray(data) ||
      !data.length
    ){

      throw new Error(
        "Username atau password salah."
      );

    }


    const hasil =
      data[0];


    const role =
      String(
        hasil.role || ""
      )
      .trim()
      .toLowerCase();


    if(role !== "guru"){

      throw new Error(
        "Akun ini bukan akun Guru."
      );

    }


    /* =========================================
       SESSION GURU
    ========================================= */

    const akunGuru = {

      id:
        Number(
          hasil.id
        ),

      username:
        hasil.username,

      role:
        "guru",

      tipe:
        "guru",

      referensi_id:
        Number(
          hasil.referensi_id
        ),

      nama:
        hasil.nama ||
        "Guru"

    };


    sessionStorage.setItem(
      "akun_guru",
      JSON.stringify(
        akunGuru
      )
    );


    /* =========================================
       CATAT LOGIN KE LOG_LOGIN
       MELALUI RPC
    ========================================= */

    const logResponse =
      await fetch(

        SUPABASE_URL +
        "/rest/v1/rpc/catat_login",

        {

          method:"POST",

          headers:
            headers(),

          body:
            JSON.stringify({

              p_username:
                akunGuru.username,

              p_role:
                "guru",

              p_referensi_id:
                akunGuru.referensi_id

            })

        }

      );


    const logText =
      await logResponse.text();


    /*
      Kalau pencatatan gagal, tampilkan
      pesannya supaya bisa diketahui.
      Login tetap dianggap berhasil.
    */

    if(!logResponse.ok){

      console.error(
        "CATAT LOGIN GURU GAGAL:",
        logText
      );

    }


    pesan.className="sukses";

    pesan.textContent =
      "Login berhasil. Membuka dashboard Guru...";


    setTimeout(
      function(){

        window.location.replace(
          "guru.html"
        );

      },
      500
    );


  }catch(error){

    console.error(
      "LOGIN GURU:",
      error
    );


    pesan.className="error";

    pesan.textContent =
      error.message ||
      "Login gagal.";


    tombol.disabled=false;

    tombol.textContent =
      "LOGIN";

  }

}


/* =====================================================
   ENTER UNTUK LOGIN
===================================================== */

document
  .getElementById(
    "password"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Enter"
      ){

        loginGuru();

      }

    }
  );


/* =====================================================
   SESSION YANG SUDAH ADA
===================================================== */

(function(){

  const saved =
    sessionStorage.getItem(
      "akun_guru"
    );


  if(!saved)
    return;


  try{

    const akun =
      JSON.parse(
        saved
      );


    if(
      akun &&
      akun.role === "guru" &&
      akun.referensi_id
    ){

      window.location.replace(
        "guru.html"
      );

    }

  }catch(error){

    sessionStorage.removeItem(
      "akun_guru"
    );

  }

})();

</script>
